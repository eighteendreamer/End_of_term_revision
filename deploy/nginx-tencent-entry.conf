# 腾讯云统一入口：域名保持解析到 1.12.37.50。
# 前端文件保留在阿里云，API/WebSocket 仅连接腾讯本机后端。
server {
    listen 80;
    server_name endreversion.pantoria.cn;
    root /www/wwwroot/endreversion-gateway;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://endreversion.pantoria.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name endreversion.pantoria.cn;
    root /www/wwwroot/endreversion-gateway;

    #SSL-START
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/endreversion.pantoria.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/endreversion.pantoria.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    #SSL-END

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location = /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        # 不带结尾 /，保留后端所需的 /api/ 前缀。
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 当前入口直接面向公网，不信任客户端自带的转发地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass https://47.109.194.175;
        proxy_http_version 1.1;
        proxy_set_header Host endreversion.pantoria.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name endreversion.pantoria.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    access_log /www/wwwlogs/endreversion.pantoria.cn.log;
    error_log /www/wwwlogs/endreversion.pantoria.cn.error.log;
}
